[project]
name = "kaucjomat"
version = "0.1.0"
description = "Interaktywny symulator polskiego systemu kaucyjnego (TRYB DEMO) z analizą wsadową i benchmarkiem GIL."
readme = "README.md"
authors = [
    { name = "damianjakubas", email = "damianjakubas98@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "matplotlib>=3.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kaucjomat = "kaucjomat:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
